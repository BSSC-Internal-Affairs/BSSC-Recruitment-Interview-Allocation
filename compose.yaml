services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bssc
      POSTGRES_PASSWORD: bssc_local
      POSTGRES_DB: bssc
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bssc"]
      interval: 5s
      retries: 10
volumes:
  postgres_data:
